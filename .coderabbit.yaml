# CodeRabbit 설정 파일
language: "ko-KR" # 리뷰 응답 언어를 한국어로 설정

reviews:
  enabled: true
  # 모든 브랜치로 향하는 PR에 대해 자동 리뷰를 활성화합니다.
  target_branches:
    - "*"
  
  # 리뷰 상세 수준 (CHILL, ASSERTIVE 등 설정 가능)
  profile: "chill"
  
  # PR 생성 시 요약 기능을 제공합니다.
  summary:
    enabled: true
    # 주식 뉴스 분석이나 Flutter 개발 관련 변경 사항을 잘 요약해줍니다.

  # 불필요한 파일은 리뷰에서 제외합니다. (예: 빌드 결과물, 설정 파일 등)
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/*.lock"

chat:
  # 리뷰 코멘트에 대해 대화형으로 질문할 수 있게 합니다.
  enabled: true
